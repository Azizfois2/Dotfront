name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  linux-x11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install X11 headers
        run: sudo apt-get update && sudo apt-get install -y build-essential libx11-dev libxext-dev
      - name: Build (X11 + MIT-SHM)
        run: make
      - name: Headless simulation smoke test
        run: |
          for p in 2 3 4 5 6; do
            ./dotfront --headless 5 --seed 3 --players $p || test $? -eq 2
          done
      - name: AI resolves matches under fog
        run: |
          for s in 1 2 3 5; do
            ./dotfront --headless 300 --seed $s --players 2 > /tmp/ai_$s.txt || true
            grep -q "WINS" /tmp/ai_$s.txt || { cat /tmp/ai_$s.txt; exit 1; }
          done
      - name: Launch under Xvfb
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a bash -c '
            ./dotfront --seed 3 &
            pid=$!
            sleep 3
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "windowed process exited unexpectedly"
              wait "$pid"
              exit 1
            fi
            kill "$pid"
          '
      - name: LAN handshake under Xvfb
        run: |
          xvfb-run -a bash -c '
            ./dotfront --host 47888 --players 3 --seed 3 > /tmp/lan_host.log 2>&1 &
            hpid=$!
            sleep 1
            ./dotfront --join 127.0.0.1:47888 > /tmp/lan_client.log 2>&1 &
            cpid=$!
            sleep 3
            kill -0 "$hpid" || { cat /tmp/lan_host.log; exit 1; }
            kill -0 "$cpid" || { cat /tmp/lan_client.log; exit 1; }
            grep -q "client joined as RED" /tmp/lan_host.log || {
              cat /tmp/lan_host.log; cat /tmp/lan_client.log; exit 1; }
            kill "$hpid" "$cpid"
          '

  linux-sdl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Build (SDL2)
        run: make sdl
      - name: Headless simulation smoke test
        run: ./dotfront_sdl --headless 5 --seed 3 --players 6 || test $? -eq 2

  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install the 64-bit mingw-w64 compiler
        timeout-minutes: 10
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=20
          sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=20 \
            gcc-mingw-w64-x86-64
      - name: Cross-compile Windows .exe
        timeout-minutes: 5
        run: make windows
      - name: Check the executable
        run: file dotfront.exe && test -s dotfront.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: cc --version
      - name: Build (native Cocoa)
        run: make
      - name: Build app bundle with icon
        run: make app && test -s "Dotfront.app/Contents/Resources/icon.icns"
      - name: Headless simulation smoke test
        run: |
          for p in 2 3 4 5 6; do
            ./dotfront --headless 5 --seed 3 --players $p || test $? -eq 2
          done
      - name: Launch the Cocoa window briefly
        run: |
          ./dotfront --seed 3 &
          pid=$!
          sleep 3
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "windowed process exited unexpectedly"
            wait "$pid"
            exit 1
          fi
          kill "$pid"
      - name: Screenshot the Cocoa window (best effort)
        continue-on-error: true
        run: |
          ./dotfront --seed 3 &
          pid=$!
          sleep 4
          WID=$(swift - <<'SWIFT'
          import CoreGraphics
          let opts: CGWindowListOption = [.optionOnScreenOnly, .excludeDesktopElements]
          if let list = CGWindowListCopyWindowInfo(opts, kCGNullWindowID) as? [[String: Any]] {
              for w in list {
                  let name = (w[kCGWindowName as String] as? String) ?? ""
                  let owner = (w[kCGWindowOwnerName as String] as? String) ?? ""
                  if name.contains("DOTFRONT") || owner == "dotfront" {
                      if let n = w[kCGWindowNumber as String] as? Int { print(n); break }
                  }
              }
          }
          SWIFT
          )
          if [ -n "$WID" ]; then
            screencapture -x -l "$WID" macos-window.png
          fi
          kill "$pid" || true
          test -s macos-window.png
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-window
          path: macos-window.png
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android NDK
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: android/build-apk.sh assembleDebug
      - name: Check APK
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libSDL2.so'
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libmain.so'
